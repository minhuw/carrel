parameters:
  - name: testId
    type: string
    values:
      - unit-electron
      - unit-node
      - unit-browser-chromium
      - unit-browser-webkit
      - integration-electron
      - integration-browser-chromium
      - integration-browser-firefox
      - integration-browser-webkit
      - integration-remote
      - smoke-electron
      - smoke-browser-chromium
      - smoke-remote
  - name: condition
    type: string

steps:
  # A retry of this job skips the test when this step succeeded in an earlier
  # attempt (see testCheckpoint.ts). It only runs when nothing in the job has
  # failed, so it only succeeds when the test did. Keep its display name unchanged.
  - script: node "$(Build.SourcesDirectory)/build/azure-pipelines/common/testCheckpoint.ts" record ${{ parameters.testId }}
    condition: ${{ parameters.condition }}
    displayName: Record ${{ parameters.testId }} checkpoint
